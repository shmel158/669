name: Build signal_forwarder exe

on:
  push:
    branches: [main, master]
    paths:
      - "signal_forwarder/**"
      - ".github/workflows/build-signal-forwarder-exe.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: signal_forwarder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        run: pyinstaller --clean --noconfirm bot.spec

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: signal_forwarder-windows
          path: signal_forwarder/dist/signal_forwarder/
